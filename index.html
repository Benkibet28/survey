<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survey Cash | Earn by sharing</title>
  <!-- Font Awesome for icons (optional) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }
    body {
      background: linear-gradient(145deg, #f6f9fc 0%, #e9f1f8 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .app-wrapper {
      max-width: 1200px;
      width: 100%;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 20, 40, 0.15), 0 8px 20px rgba(0, 0, 0, 0.05);
      padding: 2rem 2rem 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    h1 {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-weight: 700;
      font-size: 2.4rem;
      letter-spacing: -0.5px;
      color: #0b2b44;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 4px rgba(255,255,255,0.8);
    }
    h1 i {
      color: #1e7e34;
      background: #d4edda;
      padding: 10px;
      border-radius: 50%;
      font-size: 2rem;
    }
    .subhead {
      text-align: center;
      color: #2c3e50;
      font-weight: 400;
      margin-bottom: 2rem;
      font-size: 1.1rem;
      border-bottom: 2px dashed #b0c9e0;
      padding-bottom: 1rem;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 2rem;
      margin-top: 1rem;
    }
    @media (max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
        gap: 1.8rem;
      }
    }
    .card {
      background: white;
      border-radius: 1.8rem;
      padding: 1.8rem 1.8rem;
      box-shadow: 0 10px 25px rgba(0, 20, 30, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.9);
      transition: transform 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
    }
    .card h2 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #1d3b5c;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
      border-left: 6px solid #0077be;
      padding-left: 1rem;
    }
    .card h2 i {
      color: #0077be;
    }
    .input-group {
      margin-bottom: 1.2rem;
    }
    .input-group label {
      display: block;
      font-weight: 500;
      font-size: 0.9rem;
      color: #2b4b6e;
      margin-bottom: 0.4rem;
    }
    .input-group input {
      width: 100%;
      padding: 0.9rem 1.2rem;
      border: 2px solid #dbe7f2;
      border-radius: 60px;
      font-size: 1rem;
      background: #fafdff;
      transition: 0.2s;
      outline: none;
    }
    .input-group input:focus {
      border-color: #0077be;
      background: white;
      box-shadow: 0 0 0 4px rgba(0, 119, 190, 0.1);
    }
    .btn {
      border: none;
      padding: 1rem 1.5rem;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1rem;
      width: 100%;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.3px;
      margin-top: 0.6rem;
    }
    .btn-primary {
      background: #0b2b44;
      color: white;
      box-shadow: 0 10px 18px -6px #0b2b4470;
    }
    .btn-primary:hover {
      background: #143b5c;
      transform: scale(1.01);
    }
    .btn-secondary {
      background: #eaf1f9;
      color: #0b2b44;
      border: 1px solid #b8cee4;
    }
    .btn-secondary:hover {
      background: #d7e4f2;
    }
    .btn-success {
      background: #1e7e34;
      color: white;
      box-shadow: 0 10px 18px -6px #1e7e3470;
    }
    .btn-success:hover {
      background: #16682a;
    }
    .btn-outline {
      background: transparent;
      border: 2px solid #b8cee4;
      color: #1d3b5c;
    }
    .btn-outline:hover {
      background: #eef4fb;
    }
    .message-box {
      padding: 0.9rem 1.2rem;
      border-radius: 60px;
      background: #f0f7ff;
      font-weight: 500;
      color: #1d3b5c;
      margin-bottom: 1.2rem;
      font-size: 0.95rem;
      border-left: 6px solid #0077be;
    }
    .message-box.error {
      background: #ffe6e6;
      border-left-color: #c62828;
      color: #a51e1e;
    }
    .message-box.success {
      background: #e4f4e9;
      border-left-color: #1e7e34;
      color: #0a4f1c;
    }
    .payment-details {
      background: #f3f9ff;
      border-radius: 1.4rem;
      padding: 1.5rem;
      margin: 1.2rem 0;
      border: 1px solid #cbe0f5;
      font-family: 'Courier New', monospace;
    }
    .payment-details .row {
      display: flex;
      justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px dashed #b8d0e8;
    }
    .payment-details .row:last-child {
      border-bottom: none;
    }
    .payment-details .label {
      font-weight: 600;
      color: #1d3b5c;
    }
    .payment-details .value {
      font-weight: 700;
      background: #0b2b44;
      color: white;
      padding: 0.25rem 0.9rem;
      border-radius: 40px;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }
    .locked-badge {
      display: inline-block;
      background: #ff9800;
      color: white;
      font-weight: 700;
      padding: 0.35rem 1rem;
      border-radius: 40px;
      font-size: 0.85rem;
      margin-left: 10px;
      vertical-align: middle;
    }
    .unlocked-badge {
      background: #1e7e34;
    }
    .flex-row {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .survey-box {
      background: #f7faff;
      border-radius: 1.2rem;
      padding: 1.5rem;
      margin-top: 1.2rem;
      border: 2px dashed #aac7e2;
    }
    .hidden {
      display: none !important;
    }
    .user-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0b2b44;
      color: white;
      padding: 0.8rem 1.4rem;
      border-radius: 60px;
      margin-bottom: 1.8rem;
      font-weight: 500;
    }
    .user-info .email {
      opacity: 0.9;
      font-size: 0.9rem;
    }
    .logout-btn {
      background: transparent;
      border: 1.5px solid white;
      color: white;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    .logout-btn:hover {
      background: white;
      color: #0b2b44;
    }
    .inline {
      display: inline;
    }
    .small-note {
      font-size: 0.8rem;
      color: #5b7f9c;
      margin-top: 0.6rem;
      text-align: center;
    }
    .fa-spin {
      animation: fa-spin 1s infinite linear;
    }
    @keyframes fa-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <h1>
      <i class="fas fa-chart-simple"></i>
      Survey Cash
    </h1>
    <div class="subhead">Register, pay 200 KES, and start earning from surveys</div>

    <!-- MAIN CONTAINER: will be controlled by JavaScript -->
    <div id="app"></div>

    <!-- hidden template for prompt and notification (used via JS) -->
    <div id="paymentPrompt" class="hidden"></div>
  </div>

  <script>
    (function() {
      // ---------- CONFIG ----------
      const PAYBILL = "400200";
      const BUSINESS_NUMBER = "400200";   // same as paybill
      const ACCOUNT_NUMBER = "01102360343001";
      const SURVEY_FEE = 200;

      // ---------- STORAGE KEYS ----------
      const USERS_KEY = 'surveycash_users';
      const CURRENT_USER_KEY = 'surveycash_current';

      // ---------- HELPER FUNCTIONS ----------
      function getUsers() {
        const stored = localStorage.getItem(USERS_KEY);
        return stored ? JSON.parse(stored) : [];
      }

      function saveUsers(users) {
        localStorage.setItem(USERS_KEY, JSON.stringify(users));
      }

      function getCurrentUser() {
        const stored = localStorage.getItem(CURRENT_USER_KEY);
        return stored ? JSON.parse(stored) : null;
      }

      function setCurrentUser(user) {
        if (user) {
          localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(user));
        } else {
          localStorage.removeItem(CURRENT_USER_KEY);
        }
      }

      // Simulate "send to Gmail" – logs & shows a prompt message
      function sendGmailNotification(email, action = 'registered') {
        // In a real app, this would call an API / email service.
        // Here we show a friendly prompt and log.
        const message = `📧 [Gmail Simulation] A notification has been sent to ${email} (action: ${action}).`;
        console.log(message);
        // also show as temporary prompt
        showToast(message, 4000);
      }

      // Toast / prompt display (floating message)
      function showToast(text, duration = 3000) {
        const toast = document.createElement('div');
        toast.textContent = text;
        toast.style.position = 'fixed';
        toast.style.bottom = '25px';
        toast.style.left = '50%';
        toast.style.transform = 'translateX(-50%)';
        toast.style.background = '#0b2b44';
        toast.style.color = 'white';
        toast.style.padding = '0.9rem 2rem';
        toast.style.borderRadius = '60px';
        toast.style.fontWeight = '600';
        toast.style.boxShadow = '0 10px 25px rgba(0,0,0,0.2)';
        toast.style.zIndex = '9999';
        toast.style.fontSize = '0.95rem';
        toast.style.maxWidth = '90%';
        toast.style.textAlign = 'center';
        toast.style.transition = 'opacity 0.3s';
        document.body.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          setTimeout(() => toast.remove(), 400);
        }, duration);
      }

      // ---------- APP RENDER ----------
      const app = document.getElementById('app');

      function render() {
        const user = getCurrentUser();
        if (!user) {
          renderAuthScreen();
        } else {
          renderDashboard(user);
        }
      }

      // ---------- AUTH SCREEN (register + login) ----------
      function renderAuthScreen() {
        app.innerHTML = `
          <div class="grid">
            <!-- REGISTER CARD -->
            <div class="card">
              <h2><i class="fas fa-user-plus"></i> Register</h2>
              <div id="registerMessage" class="message-box hidden"></div>
              <form id="registerForm">
                <div class="input-group">
                  <label>Email address</label>
                  <input type="email" id="regEmail" placeholder="you@example.com" required>
                </div>
                <div class="input-group">
                  <label>Password</label>
                  <input type="password" id="regPassword" placeholder="••••••••" required minlength="4">
                </div>
                <button type="submit" class="btn btn-primary">
                  <i class="fas fa-user-plus"></i> Create account
                </button>
              </form>
              <div class="small-note">A Gmail notification will be sent on signup.</div>
            </div>

            <!-- LOGIN CARD -->
            <div class="card">
              <h2><i class="fas fa-sign-in-alt"></i> Login</h2>
              <div id="loginMessage" class="message-box hidden"></div>
              <form id="loginForm">
                <div class="input-group">
                  <label>Email address</label>
                  <input type="email" id="loginEmail" placeholder="you@example.com" required>
                </div>
                <div class="input-group">
                  <label>Password</label>
                  <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-secondary">
                  <i class="fas fa-arrow-right-to-bracket"></i> Login
                </button>
              </form>
            </div>
          </div>
        `;

        // Attach event listeners
        document.getElementById('registerForm').addEventListener('submit', function(e) {
          e.preventDefault();
          const email = document.getElementById('regEmail').value.trim();
          const password = document.getElementById('regPassword').value;
          const msgBox = document.getElementById('registerMessage');

          if (!email || !password) {
            showMessage(msgBox, 'Please fill all fields.', 'error');
            return;
          }
          if (password.length < 4) {
            showMessage(msgBox, 'Password must be at least 4 characters.', 'error');
            return;
          }

          const users = getUsers();
          if (users.some(u => u.email === email)) {
            showMessage(msgBox, 'This email is already registered. Please login.', 'error');
            return;
          }

          // Create user – surveyPaid = false by default
          const newUser = { email, password, surveyPaid: false, paidAt: null };
          users.push(newUser);
          saveUsers(users);

          // Show success + prompt Gmail notification
          showMessage(msgBox, '✅ Registration successful! You can now login.', 'success');
          sendGmailNotification(email, 'registered');
          document.getElementById('regEmail').value = '';
          document.getElementById('regPassword').value = '';
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
          e.preventDefault();
          const email = document.getElementById('loginEmail').value.trim();
          const password = document.getElementById('loginPassword').value;
          const msgBox = document.getElementById('loginMessage');

          if (!email || !password) {
            showMessage(msgBox, 'Enter email and password.', 'error');
            return;
          }

          const users = getUsers();
          const user = users.find(u => u.email === email && u.password === password);
          if (!user) {
            showMessage(msgBox, 'Invalid credentials. Please try again.', 'error');
            return;
          }

          // Set current user and re-render
          setCurrentUser(user);
          render();
        });
      }

      function showMessage(el, text, type = 'info') {
        el.textContent = text;
        el.className = `message-box ${type}`;
        el.classList.remove('hidden');
      }

      // ---------- DASHBOARD ----------
      function renderDashboard(user) {
        // Sync latest user data from storage (in case of changes)
        const users = getUsers();
        const freshUser = users.find(u => u.email === user.email);
        if (!freshUser) {
          // user was removed ? logout
          setCurrentUser(null);
          render();
          return;
        }
        setCurrentUser(freshUser); // update current

        const surveyUnlocked = freshUser.surveyPaid === true;

        app.innerHTML = `
          <div class="user-info">
            <span><i class="fas fa-user-circle"></i> ${freshUser.email}</span>
            <span class="email">${surveyUnlocked ? '✅ Survey unlocked' : '🔒 Survey locked'}</span>
            <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
          </div>

          <div class="grid">
            <!-- LEFT: PAYMENT CARD -->
            <div class="card">
              <h2><i class="fas fa-mobile-alt"></i> Pay via M-Pesa</h2>
              <div id="paymentMessage" class="message-box hidden"></div>

              <div class="payment-details">
                <div class="row"><span class="label">Paybill / Business No.</span> <span class="value">${PAYBILL}</span></div>
                <div class="row"><span class="label">Account Number</span> <span class="value">${ACCOUNT_NUMBER}</span></div>
                <div class="row"><span class="label">Amount</span> <span class="value">${SURVEY_FEE} KES</span></div>
              </div>

              <button id="payNowBtn" class="btn btn-success" ${surveyUnlocked ? 'disabled' : ''}>
                <i class="fas fa-lock-open"></i> ${surveyUnlocked ? 'Already paid' : 'Pay 200 KES & Unlock'}
              </button>

              <button id="simulatePaymentBtn" class="btn btn-outline" style="margin-top:0.8rem;" ${surveyUnlocked ? 'disabled' : ''}>
                <i class="fas fa-check-circle"></i> I have paid (Simulate)
              </button>

              <div class="small-note" style="margin-top:1rem;">
                <i class="fas fa-info-circle"></i> Use Paybill <strong>${PAYBILL}</strong>, Acc <strong>${ACCOUNT_NUMBER}</strong>
              </div>
            </div>

            <!-- RIGHT: SURVEY CARD (locked or unlocked) -->
            <div class="card">
              <h2>
                <i class="fas fa-clipboard-list"></i> Survey Area
                ${surveyUnlocked ? '<span class="locked-badge unlocked-badge">Unlocked</span>' : '<span class="locked-badge">Locked</span>'}
              </h2>

              <div id="surveyLockedContent" class="${surveyUnlocked ? 'hidden' : ''}">
                <div class="survey-box" style="text-align:center; padding:2rem 1rem;">
                  <i class="fas fa-lock" style="font-size:3rem; color:#b0c9e0; margin-bottom:1rem;"></i>
                  <h3 style="color:#1d3b5c;">Survey locked</h3>
                  <p style="color:#4f6f8f; margin-top:0.5rem;">Pay 200 KES to unlock the survey and start earning.</p>
                  <p style="font-weight:600; margin-top:1rem;">Use Paybill <strong>${PAYBILL}</strong> Acc <strong>${ACCOUNT_NUMBER}</strong></p>
                </div>
              </div>

              <div id="surveyUnlockedContent" class="${surveyUnlocked ? '' : 'hidden'}">
                <div class="survey-box">
                  <h3 style="display:flex; align-items:center; gap:8px; color:#1e7e34;"><i class="fas fa-check-circle"></i> Survey ready</h3>
                  <p style="margin:0.8rem 0;">Answer simple questions and earn your reward.</p>
                  <div style="background: white; border-radius: 1rem; padding: 1rem; margin-top:1rem;">
                    <p><strong>1. How often do you shop online?</strong></p>
                    <label><input type="radio" name="q1" value="daily"> Daily</label><br>
                    <label><input type="radio" name="q1" value="weekly"> Weekly</label><br>
                    <label><input type="radio" name="q1" value="monthly"> Monthly</label>
                    <p style="margin-top:1rem;"><strong>2. Would you recommend Survey Cash?</strong></p>
                    <label><input type="radio" name="q2" value="yes"> Yes</label><br>
                    <label><input type="radio" name="q2" value="no"> No</label>
                  </div>
                  <button id="submitSurveyBtn" class="btn btn-primary" style="margin-top:1.2rem;">
                    <i class="fas fa-paper-plane"></i> Submit survey (demo)
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', function() {
          setCurrentUser(null);
          render();
        });

        // Pay / simulate unlock
        const payNowBtn = document.getElementById('payNowBtn');
        const simulateBtn = document.getElementById('simulatePaymentBtn');

        if (payNowBtn && !surveyUnlocked) {
          payNowBtn.addEventListener('click', function() {
            // Show the payment prompt with paybill details
            const prompt = document.createElem
